name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: binkam
          # Statically linked, so it runs on any distribution whatever its
          # glibc; this is the one to reach for when in doubt.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: binkam
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: binkam
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: binkam
          # The runner is arm64, so this one is cross-compiled.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: binkam
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: binkam.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The binary sits at the root of the archive, which is where
      # `cargo binstall` looks for it. The licences travel with it because
      # MIT asks for its notice to come along with every copy.
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp LICENSE-MIT LICENSE-APACHE README.md dist/
          tar -czf binkam-${{ matrix.target }}.tar.gz -C dist \
            ${{ matrix.binary }} LICENSE-MIT LICENSE-APACHE README.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath binkam-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: binkam-${{ matrix.target }}
          path: binkam-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One file to check every download against.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum binkam-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
