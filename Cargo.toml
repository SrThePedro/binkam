[package]
name = "binkam"
version = "0.1.0"
edition = "2024"
# let-chains, which this uses, are stable from here on.
rust-version = "1.88"
description = "An animated, clock-centered terminal screensaver"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
directories = "6.0.0"
rand = "0.10.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
