[package]
name = "binkam"
version = "0.2.0"
edition = "2024"
# let-chains, which this uses, are stable from here on.
rust-version = "1.88"
description = "An animated, clock-centered terminal screensaver"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SrThePedro/binkam"
keywords = ["screensaver", "tui", "terminal", "clock", "ratatui"]
categories = ["command-line-utilities"]
# Nothing here is needed to build the crate.
exclude = [".github/", "packaging/", "demo.tape"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
directories = "6.0.0"
rand = "0.10.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

# Where `cargo binstall binkam` looks for a prebuilt binary, so that
# installing does not mean compiling. The archives hold the binary at their
# root rather than in a folder, which is what `bin-dir` says here.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = true
codegen-units = 1
strip = true
