[package]
name = "kumsaati"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
ratatui = "0.30.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
